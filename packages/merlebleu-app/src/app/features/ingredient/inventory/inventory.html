<div class="flex justify-between items-center mb-4">
  <h2 class="text-2xl font-bold">Inventaire des ingrédients</h2>
</div>
<div class="flex flex-wrap gap-3 items-center mb-4">
  <input
    type="text"
    pInputText
    placeholder="Rechercher par libellé..."
    (input)="onSearchChange($any($event.target).value)"
    class="w-64"
  />
  <p-select
    [(ngModel)]="filterCategoryId"
    [options]="categories()"
    optionLabel="label"
    optionValue="id"
    placeholder="Toutes catégories"
    [showClear]="true"
    (onChange)="onCategoryFilter()"
    class="w-52"
  />
  <p-select
    [(ngModel)]="filterUnitId"
    [options]="units()"
    optionLabel="label"
    optionValue="id"
    placeholder="Toutes unités"
    [showClear]="true"
    (onChange)="onUnitFilter()"
    class="w-44"
  />
</div>
<div class="flex justify-end mb-4">
  <p-button
    label="Liste à acheter"
    icon="pi pi-file-pdf"
    severity="contrast"
    (onClick)="generateShoppingList()"
  />
</div>

<p-table
  [value]="ingredients()"
  [loading]="isLoading()"
  [tableStyle]="{ 'min-width': '50rem' }"
  [stripedRows]="true"
>
  <ng-template #header>
    <tr>
      <th>Ingrédient</th>
      <th>Catégorie</th>
      <th style="width: 14rem">Quantité</th>
      <th>Unité</th>
    </tr>
  </ng-template>
  <ng-template #body let-ingredient>
    <tr>
      <td>{{ capitalizeFirstLetter(ingredient.label) }}</td>
      <td>{{ capitalizeFirstLetter(ingredient.category.label) }}</td>
      <td>
        <p-inputNumber
          [(ngModel)]="stockValues[ingredient.id]"
          [min]="0"
          [showButtons]="false"
          [useGrouping]="false"
          inputStyleClass="w-28"
          (onBlur)="onBlur(ingredient)"
        />
      </td>
      <td>{{ capitalizeFirstLetter(ingredient.unit.label) }}</td>
    </tr>
  </ng-template>
</p-table>
