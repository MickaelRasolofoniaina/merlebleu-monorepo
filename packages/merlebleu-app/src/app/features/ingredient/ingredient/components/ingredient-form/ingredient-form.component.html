<form [attr.id]="formId" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
  <div>
    <label for="ingredientLabel" class="block mb-2">Libellé</label>
    <input
      id="ingredientLabel"
      type="text"
      pInputText
      [(ngModel)]="item.label"
      name="label"
      class="w-full"
      required
    />
    @if (getFieldError('label')) {
      <small class="text-red-500 mt-1 block">{{ getFieldError('label') }}</small>
    }
  </div>
  <div>
    <label for="ingredientUnit" class="block mb-2">Unité</label>
    <p-select
      inputId="ingredientUnit"
      [(ngModel)]="item.unitId"
      name="unitId"
      [options]="units"
      optionLabel="label"
      optionValue="id"
      placeholder="Sélectionner une unité"
      fluid
      required
      appendTo="body"
    />
    @if (getFieldError('unitId')) {
      <small class="text-red-500 mt-1 block">{{ getFieldError('unitId') }}</small>
    }
  </div>
  <div>
    <label for="ingredientPayment" class="block mb-2">Méthode de paiement par défaut</label>
    <p-select
      inputId="ingredientPayment"
      [(ngModel)]="item.defaultPaymentMethodId"
      name="defaultPaymentMethodId"
      [options]="paymentMethods()"
      optionLabel="name"
      optionValue="id"
      placeholder="Aucune (à choisir à chaque saisie)"
      [showClear]="true"
      fluid
      appendTo="body"
    />
    <small class="text-slate-500 mt-1 block">Utilisée pour les achats saisis dans la grille des dépenses.</small>
  </div>
</form>
