<div class="flex justify-between items-center mb-4">
  <h2 class="text-2xl font-bold">Toutes les commandes</h2>
</div>

<div class="flex flex-wrap gap-3 mb-4">
  <order-count-card
    color="red"
    icon="pi pi-box"
    [count]="toPrepareCount()"
    label="à préparer"
  />
  <order-count-card
    color="green"
    icon="pi pi-truck"
    [count]="toDeliverCount()"
    label="à livrer"
  />
  <order-count-card
    color="orange"
    icon="pi pi-exclamation-triangle"
    [count]="lateCount()"
    label="en retard"
  />
</div>

<div class="flex justify-between items-center mb-4">
  <p-selectButton
    [options]="displayModeOptions"
    [(ngModel)]="displayMode"
    (onChange)="onDisplayModeChange()"
    optionLabel="label"
    optionValue="value"
  >
    <ng-template #item let-item>
      <i [class]="item.icon" [attr.title]="item.label"></i>
    </ng-template>
  </p-selectButton>
  <p-button label="Nouvelle commande" icon="pi pi-plus" severity="primary" (onClick)="openAddOrder()" />
</div>

@if (displayMode() === CALENDAR_VIEW) {
<order-calendar-view
  [orders]="calendarOrders()"
  [loading]="isCalendarLoading"
  (rangeChange)="onCalendarRangeChange($event)"
  (eventClick)="openOrderDetail($event)"
/>
} @else {
<div class="flex flex-wrap gap-3 items-center mb-4">
  <input
    pInputText
    [(ngModel)]="filters.customerName"
    placeholder="Nom du client..."
    class="w-52"
  />
  <p-datepicker
    [(ngModel)]="filters.orderDate"
    [showIcon]="true"
    dateFormat="dd/mm/yy"
    placeholder="Date de commande"
    class="w-52"
  />
  <p-datepicker
    [(ngModel)]="filters.deliveryDate"
    [showIcon]="true"
    dateFormat="dd/mm/yy"
    placeholder="Date de livraison"
    class="w-52"
  />
  <p-select
    [(ngModel)]="filters.shopId"
    [options]="shops()"
    optionLabel="address"
    optionValue="id"
    placeholder="Toutes les boutiques"
    class="w-52"
    [showClear]="true"
  />
  <p-select
    [(ngModel)]="filters.orderStatus"
    [options]="statusOptions"
    optionLabel="label"
    optionValue="value"
    placeholder="Tous les statuts"
    class="w-52"
    [showClear]="true"
  />
  <p-button label="Filtrer" icon="pi pi-search" (onClick)="applyFilters()" [disabled]="isLoading" severity="info" />
  <p-button
    label="Réinitialiser"
    icon="pi pi-refresh"
    severity="contrast"
    (onClick)="resetFilters()"
    [disabled]="isLoading"
  />
</div>

@if (displayMode() === OrderDisplayMode.STANDARD) {
<order-cash-table
  [orders]="orders()"
  [loading]="isLoading"
  [totalRecords]="totalRecords"
  [first]="first"
  [pageSize]="rows"
  (pageChange)="onPageChange($event)"
  (viewDetail)="openOrderDetail($event)"
  (editOrder)="openEditOrder($event)"
  (deliver)="openDeliverDialog($event)"
/>
} @else {
<order-agenda-view
  [orders]="orders()"
  [loading]="isLoading"
  (viewDetail)="openOrderDetail($event)"
/>
<p-paginator
  [first]="first"
  [rows]="rows"
  [totalRecords]="totalRecords"
  (onPageChange)="onPageChange({ first: $event.first ?? 0, rows: $event.rows ?? rows })"
/>
}
}

<order-detail-dialog [order]="selectedOrder()" [(visible)]="displayOrderDetailDialog" />

<order-form-dialog
  [orderData]="editingOrder"
  [isEdit]="!!editingOrderId"
  [isLoading]="isFormLoading"
  [(visible)]="displayOrderFormDialog"
  (orderSubmit)="handleOrderSubmit($event)"
/>

<p-dialog
  [(visible)]="displayDeliverDialog"
  [modal]="true"
  [style]="{ width: '28rem' }"
  header="Livrer la commande"
>
  @if (orderToDeliver(); as order) {
  <div class="flex flex-col gap-4">
    <div
      class="flex items-center justify-between rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 p-3"
    >
      <span class="text-slate-500">Reste à payer</span>
      <span class="font-bold text-slate-900 dark:text-white">{{
        order.balanceAmount | number: '1.0-2'
      }}</span>
    </div>
    @if (order.balanceAmount > 0) {
    <div class="flex flex-col gap-2">
      <label class="font-semibold text-slate-900 dark:text-white">Méthode de paiement du reste</label>
      <p-select
        [(ngModel)]="deliverPaymentMethodId"
        [options]="paymentMethods()"
        optionLabel="name"
        optionValue="id"
        placeholder="Sélectionner une méthode"
        appendTo="body"
        class="w-full"
      />
    </div>
    }
  </div>
  }
  <div class="flex justify-end gap-2 mt-6">
    <p-button
      label="Annuler"
      severity="contrast"
      (onClick)="cancelDeliver()"
      [disabled]="isDelivering"
    />
    <p-button
      label="Livrer"
      icon="pi pi-check"
      severity="success"
      (onClick)="confirmDeliver()"
      [loading]="isDelivering"
      [disabled]="!deliverPaymentMethodId"
    />
  </div>
</p-dialog>
