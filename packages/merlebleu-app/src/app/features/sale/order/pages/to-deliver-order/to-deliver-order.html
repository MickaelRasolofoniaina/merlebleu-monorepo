<div class="flex justify-between items-center mb-4">
  <h2 class="text-2xl font-bold">Commandes à livrer</h2>
</div>

<div class="flex flex-wrap gap-3 items-center mb-4">
  <input
    pInputText
    [(ngModel)]="filters.customerName"
    placeholder="Nom du client..."
    class="w-52"
  />
  <p-select
    [(ngModel)]="filters.shopId"
    [options]="shops()"
    optionLabel="address"
    optionValue="id"
    placeholder="Toutes boutiques"
    class="w-52"
    [showClear]="true"
  />
  <p-select
    [(ngModel)]="filters.orderStatus"
    [options]="statusOptions"
    optionLabel="label"
    optionValue="value"
    placeholder="Tout statuts"
    class="w-52"
    [showClear]="true"
  />
  <p-button
    label="Réinitialiser"
    icon="pi pi-refresh"
    severity="secondary"
    [outlined]="true"
    (onClick)="resetFilters()"
    [disabled]="isLoading"
  />
  <p-button label="Filtrer" icon="pi pi-search" (onClick)="applyFilters()" [disabled]="isLoading" />
</div>

<p-table
  [value]="orders()"
  [loading]="isLoading"
  [tableStyle]="{ 'min-width': '40rem' }"
  [stripedRows]="true"
  [paginator]="true"
  [rows]="rows"
  [first]="first"
  [totalRecords]="totalRecords"
  [lazy]="true"
  (onPage)="onPageChange($event)"
>
  <ng-template #header>
    <tr>
      <th>Client</th>
      <th>Date de livraison</th>
      <th>Adresse de livraison</th>
      <th>Boutique</th>
      <th>Statut</th>
      <th class="text-center!">Actions</th>
    </tr>
  </ng-template>
  <ng-template #body let-order>
    <tr>
      <td>{{ order.customerName }}</td>
      <td>
        {{ order.deliveryDate | date: 'dd/MM/yyyy' }} à {{ order.deliveryDate | date: 'HH:mm' }}
      </td>
      <td>{{ order.deliveryAddress }}</td>
      <td>{{ order.shop.address }}</td>
      <td>
        <p-badge
          [value]="getStatus(order.orderStatus)"
          [severity]="getStatusColor(order.orderStatus)"
          style="height: fit-content"
        ></p-badge>
      </td>
      <td class="text-center!">
        <p-button
          icon="pi pi-info-circle"
          severity="info"
          (onClick)="openOrderDetail(order)"
          size="small"
        />
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="6" class="text-center-important py-6">Aucune commande à livrer</td>
    </tr>
  </ng-template>
</p-table>

<order-detail-dialog [order]="selectedOrder()" [(visible)]="displayOrderDetailDialog" />
