<div class="flex justify-between items-center mb-4">
  <h2 class="text-2xl font-bold">Commandes à livrer</h2>
</div>

<p-table
  [value]="orders()"
  [loading]="isLoading"
  [tableStyle]="{ 'min-width': '30rem' }"
  [stripedRows]="true"
  [paginator]="true"
  [rows]="rows"
  [first]="first"
  [totalRecords]="totalRecords"
  [lazy]="true"
  (onPage)="onPageChange($event)"
>
  <ng-template #header>
    <tr>
      <th>Client</th>
      <th>Commande</th>
      <th style="width: 10rem" class="text-center!">Actions</th>
    </tr>
  </ng-template>
  <ng-template #body let-order>
    <tr>
      <td>{{ order.customerName }}</td>
      <td>{{ getDescription(order) }}</td>
      <td>
        <p-button
          icon="pi pi-book"
          [rounded]="true"
          [outlined]="true"
          severity="secondary"
          class="mr-2"
          (onClick)="goToOrderDetail(order)"
        />
        <p-button
          icon="pi pi-pencil"
          [rounded]="true"
          [outlined]="true"
          severity="warn"
          (onClick)="goToEditOrder(order)"
        />
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="3" class="text-center-important py-6">Aucune commande à livrer</td>
    </tr>
  </ng-template>
</p-table>
