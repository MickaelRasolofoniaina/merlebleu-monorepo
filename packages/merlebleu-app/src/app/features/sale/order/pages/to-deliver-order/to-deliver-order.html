<div class="flex justify-between items-center mb-4">
  <h2 class="text-2xl font-bold">Commandes à livrer</h2>
</div>

<div class="border border-dashed border-slate-200 rounded-xl p-5 mb-6">
  <h3 class="text-lg font-semibold mb-4">Filtres</h3>
  <div class="flex flex-wrap items-end gap-4">
    <div class="flex flex-col gap-2 min-w-[200px]">
      <label class="font-semibold text-slate-900 dark:text-white">Nom du client</label>
      <input
        pInputText
        [(ngModel)]="filters.customerName"
        placeholder="Contient..."
        class="w-full"
      />
    </div>
    <div class="flex gap-3">
      <p-button
        label="Réinitialiser"
        icon="pi pi-refresh"
        severity="secondary"
        [outlined]="true"
        (onClick)="resetFilters()"
        [disabled]="isLoading"
      />
      <p-button
        label="Filtrer"
        icon="pi pi-search"
        (onClick)="applyFilters()"
        [disabled]="isLoading"
      />
    </div>
  </div>
</div>

<p-table
  [value]="orders()"
  [loading]="isLoading"
  [tableStyle]="{ 'min-width': '40rem' }"
  [stripedRows]="true"
  [paginator]="true"
  [rows]="rows"
  [first]="first"
  [totalRecords]="totalRecords"
  [lazy]="true"
  (onPage)="onPageChange($event)"
>
  <ng-template #header>
    <tr>
      <th>Client</th>
      <th>Commande</th>
      <th>Remarques</th>
      <th>Statut</th>
    </tr>
  </ng-template>
  <ng-template #body let-order>
    <tr>
      <td>
        <a class="cursor-pointer hover:underline" (click)="goToOrderDetail(order)">
          {{ order.customerName }}
        </a>
      </td>
      <td>
        <div *ngFor="let item of order.orderItems" class="mb-1">
          <div>{{ item.type }} ({{ item.size }})</div>
          @if (item.remarks?.trim()) {
          <div class="text-sm text-slate-500">{{ item.remarks }}</div>
          }
        </div>
      </td>
      <td>{{ formatRemarks(order.remarks) }}</td>
      <td>
        <p-badge
          [value]="getStatus(order.orderStatus)"
          [severity]="getStatusColor(order.orderStatus)"
          style="height: fit-content"
        ></p-badge>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="4" class="text-center-important py-6">Aucune commande à livrer</td>
    </tr>
  </ng-template>
</p-table>
