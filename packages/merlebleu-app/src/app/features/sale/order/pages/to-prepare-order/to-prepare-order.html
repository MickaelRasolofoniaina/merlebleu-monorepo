<div class="flex justify-between items-center mb-4">
  <h2 class="text-2xl font-bold">Commandes à préparer</h2>
</div>

<div class="border border-dashed border-slate-200 rounded-xl p-5 mb-6">
  <h3 class="text-lg font-semibold mb-4">Filtres</h3>
  <div class="flex flex-wrap items-end gap-4">
    <div class="flex flex-col gap-2 min-w-[200px]">
      <label class="font-semibold text-slate-900 dark:text-white">Nom du client</label>
      <input
        pInputText
        [(ngModel)]="filters.customerName"
        placeholder="Contient..."
        class="w-full"
      />
    </div>
    <div class="flex flex-col gap-2 min-w-[200px]">
      <label class="font-semibold text-slate-900 dark:text-white">Boutique</label>
      <p-select
        [(ngModel)]="filters.shopId"
        [options]="shops()"
        optionLabel="address"
        optionValue="id"
        placeholder="Toutes les boutiques"
        class="w-full"
        [showClear]="true"
      />
    </div>
    <div class="flex flex-col gap-2 min-w-[200px]">
      <label class="font-semibold text-slate-900 dark:text-white">Statut</label>
      <p-select
        [(ngModel)]="filters.orderStatus"
        [options]="statusOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="Tous les statuts"
        class="w-full"
        [showClear]="true"
      />
    </div>
    <div class="flex gap-3">
      <p-button
        label="Réinitialiser"
        icon="pi pi-refresh"
        severity="secondary"
        [outlined]="true"
        (onClick)="resetFilters()"
        [disabled]="isLoading"
      />
      <p-button
        label="Filtrer"
        icon="pi pi-search"
        (onClick)="applyFilters()"
        [disabled]="isLoading"
      />
    </div>
  </div>
</div>

<p-confirm-dialog />

<p-table
  [value]="orders()"
  [loading]="isLoading"
  [tableStyle]="{ 'min-width': '40rem' }"
  [stripedRows]="true"
  [paginator]="true"
  [rows]="rows"
  [first]="first"
  [totalRecords]="totalRecords"
  [lazy]="true"
  (onPage)="onPageChange($event)"
>
  <ng-template #header>
    <tr>
      <th>Client</th>
      <th>Date de livraison</th>
      <th>Boutique</th>
      <th>Statut</th>
      <th class="text-center!">Actions</th>
    </tr>
  </ng-template>
  <ng-template #body let-order>
    <tr>
      <td>{{ order.customerName }}</td>
      <td>
        {{ order.deliveryDate | date: 'dd/MM/yyyy' }} à {{ order.deliveryDate | date: 'HH:mm' }}
      </td>
      <td>{{ order.shop.address }}</td>
      <td>
        <p-badge
          [value]="getStatus(order.orderStatus)"
          [severity]="getStatusColor(order.orderStatus)"
          style="height: fit-content"
        ></p-badge>
      </td>
      <td class="text-center!">
        <p-button
          icon="pi pi-info-circle"
          severity="info"
          class="mr-2"
          (onClick)="openOrderDetail(order)"
          size="small"
        />
        <p-button
          icon="pi pi-check"
          [loading]="isCompleting(order)"
          (onClick)="onComplete(order)"
          severity="success"
          [disabled]="isOrderCompleted(order)"
          size="small"
        />
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="5" class="text-center-important py-6">Aucune commande à préparer</td>
    </tr>
  </ng-template>
</p-table>

<order-detail-dialog [order]="selectedOrder()" [(visible)]="displayOrderDetailDialog" />
