<div class="flex justify-between items-center mb-4">
  <h2 class="text-2xl font-bold">Commandes à préparer</h2>
</div>

<stat-card
  class="mb-4"
  color="red"
  icon="pi pi-box"
  [count]="itemsCount()"
  label="à préparer"
/>

<div class="flex justify-start mb-4">
  <p-selectButton
    [options]="displayModeOptions"
    [(ngModel)]="displayMode"
    (onChange)="onDisplayModeChange()"
    optionLabel="label"
    optionValue="value"
  >
    <ng-template #item let-item>
      <i [class]="item.icon" [attr.title]="item.label"></i>
    </ng-template>
  </p-selectButton>
</div>

<p-confirm-dialog />

@if (displayMode() === CALENDAR_VIEW) {
<order-calendar-view
  [orders]="calendarOrders()"
  [loading]="isCalendarLoading"
  (rangeChange)="onCalendarRangeChange($event)"
  (eventClick)="openOrderDetail($event)"
/>
} @else {
<div class="flex flex-wrap gap-3 items-center mb-4">
  <input
    pInputText
    [(ngModel)]="filters.customerName"
    placeholder="Nom du client..."
    class="w-52"
  />
  <p-datepicker
    [(ngModel)]="filters.orderDate"
    [showIcon]="true"
    dateFormat="dd/mm/yy"
    placeholder="Date de commande"
    class="w-52"
  />
  <p-datepicker
    [(ngModel)]="filters.deliveryDate"
    [showIcon]="true"
    dateFormat="dd/mm/yy"
    placeholder="Date de livraison"
    class="w-52"
  />
  <p-select
    [(ngModel)]="filters.shopId"
    [options]="shops()"
    optionLabel="address"
    optionValue="id"
    placeholder="Toutes les boutiques"
    class="w-52"
    [showClear]="true"
  />
  <p-button label="Filtrer" icon="pi pi-search" (onClick)="applyFilters()" [disabled]="isLoading" severity="info" />
  <p-button
    label="Réinitialiser"
    icon="pi pi-refresh"
    severity="contrast"
    (onClick)="resetFilters()"
    [disabled]="isLoading"
  />

</div>

@if (displayMode() === OrderDisplayMode.STANDARD) {
<order-cash-table
  [orders]="orders()"
  [loading]="isLoading"
  [totalRecords]="totalRecords"
  [first]="first"
  [pageSize]="rows"
  [showEditAction]="false"
  [showDeliverAction]="false"
  [showCompleteAction]="true"
  [completingOrderIds]="completingIds()"
  (pageChange)="onPageChange($event)"
  (viewDetail)="openOrderDetail($event)"
  (complete)="onComplete($event)"
/>
} @else {
<order-agenda-view
  [orders]="orders()"
  [loading]="isLoading"
  [totalRecords]="totalRecords"
  [first]="first"
  [pageSize]="rows"
  [showCompleteAction]="true"
  [showDeliverAction]="false"
  [completingOrderIds]="completingIds()"
  (pageChange)="onPageChange($event)"
  (viewDetail)="openOrderDetail($event)"
  (complete)="onComplete($event)"
/>
}
}

<order-detail-dialog [order]="selectedOrder()" [(visible)]="displayOrderDetailDialog" />
