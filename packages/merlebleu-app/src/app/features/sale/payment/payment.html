<div class="flex justify-between items-center mb-4">
  <h2 class="text-2xl font-bold">Méthode de paiement</h2>
</div>
<div class="flex justify-end mb-4">
  <p-button label="Ajouter" icon="pi pi-plus" (onClick)="addPaymentMethod()" />
</div>

<p-table
  [value]="paymentMethods()"
  [loading]="isLoadingPayments"
  [tableStyle]="{ 'min-width': '50rem' }"
  [stripedRows]="true"
>
  <ng-template #header>
    <tr>
      <th>Nom</th>
      <th>Couleur</th>
      <th style="width: 10rem" class="text-center!">Actions</th>
    </tr>
  </ng-template>
  <ng-template #body let-payment>
    <tr>
      <td>{{ payment.name }}</td>
      <td><payment-method-badge [name]="payment.name" [color]="payment.color" /></td>
      <td class="text-center!">
        <p-button
          icon="pi pi-pencil"
          size="small"
          severity="warn"
          class="mr-2"
          (onClick)="editPaymentMethod(payment)"
        />
        <p-button
          icon="pi pi-trash"
          size="small"
          severity="danger"
          (onClick)="deletePaymentMethod(payment.id, payment.name)"
        />
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog
  [(visible)]="displayModal"
  [modal]="true"
  [style]="{ width: '450px' }"
  header="Ajouter une méthode de paiement"
>
  <div class="flex flex-col gap-4">
    <div>
      <label for="paymentMethodName" class="block mb-2">Nom</label>
      <input
        id="paymentMethodName"
        type="text"
        pInputText
        [(ngModel)]="newPaymentMethodName"
        class="w-full"
        placeholder="Entrez le nom de la méthode de paiement"
      />
      @if (validationError) {
        <small class="text-red-500 mt-1 block">{{ validationError }}</small>
      }
    </div>
    <div>
      <label for="paymentMethodColor" class="block mb-2">Couleur</label>
      <div class="flex items-center gap-3">
        <input
          id="paymentMethodColor"
          type="color"
          [(ngModel)]="newPaymentMethodColor"
          class="h-10 w-14 cursor-pointer rounded border border-slate-300 bg-transparent p-1"
        />
        <payment-method-badge [name]="newPaymentMethodName || 'Aperçu'" [color]="newPaymentMethodColor" />
      </div>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button label="Annuler" severity="contrast" (onClick)="cancelAddPaymentMethod()" />
      <p-button label="Confirmer" (onClick)="confirmAddPaymentMethod()" />
    </div>
  </ng-template>
</p-dialog>

<p-dialog
  [(visible)]="displayEditModal"
  [modal]="true"
  [style]="{ width: '450px' }"
  header="Modifier une méthode de paiement"
>
  <div class="flex flex-col gap-4">
    <div>
      <label for="editPaymentMethodName" class="block mb-2">Nom</label>
      <input
        id="editPaymentMethodName"
        type="text"
        pInputText
        [(ngModel)]="editPaymentMethodName"
        class="w-full"
        placeholder="Entrez le nom de la méthode de paiement"
      />
      @if (editValidationError) {
        <small class="text-red-500 mt-1 block">{{ editValidationError }}</small>
      }
    </div>
    <div>
      <label for="editPaymentMethodColorInput" class="block mb-2">Couleur</label>
      <div class="flex items-center gap-3">
        <input
          id="editPaymentMethodColorInput"
          type="color"
          [(ngModel)]="editPaymentMethodColor"
          class="h-10 w-14 cursor-pointer rounded border border-slate-300 bg-transparent p-1"
        />
        <payment-method-badge [name]="editPaymentMethodName || 'Aperçu'" [color]="editPaymentMethodColor" />
      </div>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button label="Annuler" severity="contrast" (onClick)="cancelEditPaymentMethod()" />
      <p-button label="Modifier" (onClick)="confirmUpdatePaymentMethod()" />
    </div>
  </ng-template>
</p-dialog>

<p-dialog
  [(visible)]="displayDeleteModal"
  [modal]="true"
  [style]="{ width: '450px' }"
  header="Confirmer la suppression"
>
  <div class="flex flex-col gap-4">
    <p>
      Voulez-vous vraiment supprimer la méthode de paiement
      <strong>{{ deletePaymentMethodName }}</strong> ?
    </p>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button label="Annuler" severity="contrast" (onClick)="cancelDeletePaymentMethod()" />
      <p-button label="Supprimer" severity="danger" (onClick)="confirmDeletePaymentMethod()" />
    </div>
  </ng-template>
</p-dialog>
