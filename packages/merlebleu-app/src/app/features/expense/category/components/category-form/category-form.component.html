<form [id]="formId()" (submit)="onSubmit()" class="flex flex-col gap-4">
  <div class="flex flex-col gap-1">
    <label for="categoryLabel" class="font-semibold text-slate-900 dark:text-white">Désignation</label>
    <input
      id="categoryLabel"
      type="text"
      pInputText
      [ngModel]="label()"
      (ngModelChange)="label.set($event)"
      name="label"
      class="w-full"
    />
    @if (submitted() && labelError()) {
      <small class="text-red-500">{{ labelError() }}</small>
    }
  </div>

  <div class="flex flex-col gap-1">
    <label for="categorySection" class="font-semibold text-slate-900 dark:text-white">Section</label>
    <p-select
      inputId="categorySection"
      [options]="sections"
      optionLabel="label"
      optionValue="value"
      [ngModel]="section()"
      (ngModelChange)="section.set($event)"
      name="section"
      fluid
      appendTo="body"
    />
  </div>
</form>
