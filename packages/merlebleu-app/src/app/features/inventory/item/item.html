<div class="flex justify-between items-center mb-4">
  <h2 class="text-2xl font-bold">Articles</h2>
</div>
<div class="flex flex-wrap gap-3 items-center mb-4">
  <input
    type="text"
    pInputText
    placeholder="Rechercher par nom..."
    (input)="onSearchChange($event.target.value)"
    class="w-64"
  />
  <p-select
    [(ngModel)]="filterType"
    [options]="itemTypes"
    placeholder="Tous les types"
    [showClear]="true"
    (onChange)="onTypeFilter()"
    class="w-52"
  />
  <p-button label="Ajouter" icon="pi pi-plus" (onClick)="openAddModal()" class="ml-auto" />
</div>

<p-table
  [value]="items()"
  [loading]="isLoading()"
  [tableStyle]="{ 'min-width': '50rem' }"
  [stripedRows]="true"
  [paginator]="true"
  [rows]="rows"
  [totalRecords]="totalRecords()"
  [first]="first()"
  (onPage)="onTablePage($event)"
>
  <ng-template #header>
    <tr>
      <th>Nom</th>
      <th>Prix Unitaire</th>
      <th>Type</th>
      <th class="text-right!">Jours de Rétention</th>
      <th style="width: 12rem" class="text-center!">Actions</th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ capitalizeFirstLetter(item.label) }}</td>
      <td>{{ formatUnitPrice(item.unitPrice) }}</td>
      <td>{{ capitalizeFirstLetter(item.type) }}</td>
      <td class="text-right!">{{ item.maxRetentionDays }}</td>
      <td class="text-center!">
        <p-button
          icon="pi pi-pencil"
          size="small"
          severity="warn"
          class="mr-2"
          (onClick)="openEditModal(item)"
        />
        <p-button
          icon="pi pi-trash"
          size="small"
          severity="danger"
          (onClick)="openDeleteModal(item)"
        />
      </td>
    </tr>
  </ng-template>
</p-table>
<!-- Edit Modal -->
<p-dialog
  [(visible)]="showEditModal"
  [modal]="true"
  [style]="{ width: '450px' }"
  header="Editer un article"
  (onHide)="closeEditModal()"
>
  <mb-item-form
    [formId]="'edit-item-form'"
    [itemData]="selectedItem"
    (itemSubmit)="selectedItem && editItem(selectedItem.id, $event)"
  ></mb-item-form>
  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button label="Annuler" severity="danger" (onClick)="closeEditModal()" />
      <button pButton type="submit" form="edit-item-form">Enregistrer</button>
    </div>
  </ng-template>
</p-dialog>

<!-- Add Modal -->
<p-dialog
  [(visible)]="showModal"
  [modal]="true"
  [style]="{ width: '450px' }"
  header="Ajouter un article"
  (onClose)="closeAddModal()"
>
  <mb-item-form
    [formId]="'add-item-form'"
    [itemData]="null"
    (itemSubmit)="addItem($event)"
  ></mb-item-form>
  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button label="Annuler" severity="danger" (onClick)="closeAddModal()" />
      <button pButton type="submit" form="add-item-form">Ajouter</button>
    </div>
  </ng-template>
</p-dialog>

<!-- Delete Confirmation Modal -->
<p-dialog
  [(visible)]="showDeleteModal"
  [modal]="true"
  [style]="{ width: '450px' }"
  header="Confirmer la suppression"
  (onHide)="closeDeleteModal()"
>
  <div class="flex flex-col gap-4">
    <p>Confirmer la suppression de l'article <strong>{{ selectedItem?.label }}</strong> ?</p>
  </div>
  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button label="Annuler" severity="secondary" (onClick)="closeDeleteModal()" />
      <p-button
        label="Supprimer"
        severity="danger"
        (onClick)="selectedItem && deleteItem(selectedItem.id)"
      />
    </div>
  </ng-template>
</p-dialog>
