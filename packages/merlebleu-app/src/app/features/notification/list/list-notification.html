<p-confirm-dialog />

<div class="flex justify-between items-center mb-4">
  <h2 class="text-2xl font-bold">Notifications</h2>
  <p-button
    icon="pi pi-check"
    severity="contrast"
    (onClick)="confirmMarkAllAsRead()"
    label="Marquer tout comme lue"
  />
</div>

<p-table
  [value]="notifications()"
  [loading]="isLoading()"
  [tableStyle]="{ 'min-width': '50rem' }"
  [stripedRows]="true"
  [paginator]="true"
  [rows]="rows"
  [totalRecords]="totalRecords()"
  [first]="first()"
  (onPage)="onTablePage($event)"
>
  <ng-template #header>
    <tr>
      <th style="width: 14rem">Date</th>
      <th style="width: 14rem">Titre</th>
      <th>Description</th>
      <th style="width: 10rem" class="text-center!">Action</th>
    </tr>
  </ng-template>
  <ng-template #body let-notification>
    <tr
      [class.font-bold]="!notification.isRead"
      [class.italic]="notification.isRead"
      class="cursor-pointer"
      (click)="onNotificationRowClick(notification)"
    >
      <td>{{ formatNotificationDate(notification.createdAt) }}</td>
      <td>
        <p-tag
          [icon]="getNotificationTypeMeta(notification.type).icon"
          [severity]="getNotificationTypeMeta(notification.type).severity"
          [value]="getNotificationTypeMeta(notification.type).title"
        />
      </td>
      <td>
        {{
          getNotificationTypeMeta(notification.type).description(
            notification.customerName,
            notification.actorName
          )
        }}
      </td>
      <td class="text-center!">
        @if (notification.isRead) {
          <span class="text-surface-400 text-sm italic">Lu</span>
        } @else {
          <p-button
            icon="pi pi-check"
            severity="success"
            size="small"
            (onClick)="markAsRead(notification); $event.stopPropagation()"
          />
        }
      </td>
    </tr>
  </ng-template>
</p-table>
