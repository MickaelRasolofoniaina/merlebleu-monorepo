<div class="flex justify-between items-center mb-4">
  <h2 class="text-2xl font-bold">Boutiques</h2>
  <p-button label="Ajouter" icon="pi pi-plus" (onClick)="openAdd()" />
</div>

<p-table
  [value]="shops()"
  [loading]="isLoading()"
  [tableStyle]="{ 'min-width': '30rem' }"
  [stripedRows]="true"
>
  <ng-template #header>
    <tr>
      <th>Adresse</th>
      <th class="text-center!">Actions</th>
    </tr>
  </ng-template>
  <ng-template #body let-shop>
    <tr>
      <td>{{ shop.address }}</td>
      <td class="text-center!">
        <p-button
          icon="pi pi-pencil"
          size="small"
          severity="warn"
          (onClick)="openEdit(shop)"
        />
        <p-button
          icon="pi pi-trash"
          size="small"
          severity="danger"
          class="ml-2"
          (onClick)="openDelete(shop)"
        />
      </td>
    </tr>
  </ng-template>
  <ng-template #empty>
    <tr>
      <td colspan="2" class="text-center py-4 text-gray-500">Aucune boutique trouvée</td>
    </tr>
  </ng-template>
</p-table>

<!-- Dialog Ajout -->
<p-dialog
  [(visible)]="showAddModal"
  [modal]="true"
  [style]="{ width: '400px' }"
  header="Ajouter une boutique"
>
  <div class="flex flex-col gap-4 pt-2">
    <div>
      <label for="addAddress" class="block mb-2 font-semibold text-slate-900 dark:text-white">Adresse</label>
      <input
        id="addAddress"
        type="text"
        pInputText
        [(ngModel)]="addAddress"
        class="w-full"
        placeholder="Ex: Anosy Avaratra"
      />
      @if (addError) {
        <small class="text-red-500 mt-1 block">{{ addError }}</small>
      }
    </div>
  </div>
  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button label="Annuler" severity="secondary" (onClick)="showAddModal = false" />
      <p-button label="Ajouter" (onClick)="submitAdd()" />
    </div>
  </ng-template>
</p-dialog>

<!-- Dialog Modification -->
<p-dialog
  [(visible)]="showEditModal"
  [modal]="true"
  [style]="{ width: '400px' }"
  header="Modifier la boutique"
>
  <div class="flex flex-col gap-4 pt-2">
    <div>
      <label for="editAddress" class="block mb-2 font-semibold text-slate-900 dark:text-white">Adresse</label>
      <input
        id="editAddress"
        type="text"
        pInputText
        [(ngModel)]="editAddress"
        class="w-full"
      />
      @if (editError) {
        <small class="text-red-500 mt-1 block">{{ editError }}</small>
      }
    </div>
  </div>
  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button label="Annuler" severity="secondary" (onClick)="showEditModal = false" />
      <p-button label="Enregistrer" (onClick)="submitEdit()" />
    </div>
  </ng-template>
</p-dialog>

<!-- Dialog Suppression -->
<p-dialog
  [(visible)]="showDeleteModal"
  [modal]="true"
  [style]="{ width: '400px' }"
  header="Confirmer la suppression"
>
  <p>
    Confirmer la suppression de la boutique <strong>{{ selectedShop?.address }}</strong> ?
  </p>
  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button label="Annuler" severity="secondary" (onClick)="showDeleteModal = false" />
      <p-button label="Supprimer" severity="danger" (onClick)="confirmDelete()" />
    </div>
  </ng-template>
</p-dialog>
