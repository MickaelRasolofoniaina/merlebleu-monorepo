<div
  class="inline-flex items-center gap-3 px-4 py-2.5 rounded-lg border"
  [class]="classes().container"
>
  <i class="pi text-xl" [class]="icon() + ' ' + classes().text"></i>
  <span class="text-2xl font-bold" [class]="classes().text">{{ count() }}</span>
  <span class="text-sm font-semibold" [class]="classes().text">
    commande{{ count() > 1 ? 's' : '' }} {{ label() }}
  </span>
</div>
