<header class="flex justify-between items-center p-4 bg-white dark:bg-slate-800 shadow">
  <div class="flex items-center">
    <p-button
      icon="pi pi-bars"
      [text]="true"
      severity="secondary"
      class="mr-2"
      (onClick)="toggleSidebar()"
    />
    <h1>Le Merlebleu</h1>
  </div>
  <div class="flex items-center">
    <p-overlay-badge
      [value]="notificationService.unreadCount()"
      [badgeDisabled]="notificationService.unreadCount() === 0"
      severity="danger"
      class="ml-2"
    >
      <p-button
        icon="pi pi-bell"
        [text]="true"
        severity="secondary"
        (onClick)="notifPopover.toggle($event)"
      />
    </p-overlay-badge>
    <p-popover #notifPopover>
      <app-notification-panel (notificationOpened)="notifPopover.hide()" />
    </p-popover>
    <button
      type="button"
      class="profile-button ml-2"
      aria-label="Profil"
      (click)="profilePopover.toggle($event)"
    >
      <p-avatar icon="pi pi-user" shape="circle" />
    </button>
    <p-popover #profilePopover>
      <div class="flex flex-col gap-1 min-w-48">
        <p class="font-semibold px-2 py-1">{{ name() }}</p>
        <p-button
          [label]="themeService.isDarkMode() ? 'Mode clair' : 'Mode sombre'"
          [icon]="themeService.isDarkMode() ? 'pi pi-sun' : 'pi pi-moon'"
          [text]="true"
          severity="secondary"
          class="w-full"
          styleClass="w-full !justify-start"
          (onClick)="themeService.toggleTheme()"
        />
        <p-button
          label="Se déconnecter"
          icon="pi pi-sign-out"
          [text]="true"
          severity="secondary"
          class="w-full"
          styleClass="w-full !justify-start"
          (onClick)="profilePopover.hide(); logout()"
        />
      </div>
    </p-popover>
  </div>
</header>
<main class="main">
  @if (sidebarOpen()) {
  <div class="sidebar">
    <p-menu [model]="items" class="menu">
      <ng-template #item let-item>
        @if (item.routerLink) {
        <a
          pRipple
          class="p-menu-item-link flex items-center gap-2"
          [routerLink]="item.routerLink"
          routerLinkActive="p-menu-item-link-active"
        >
          <span class="p-menu-item-icon" [class]="item.icon"></span>
          <span class="p-menu-item-label">{{ item.label }}</span>
          @if (getBadge(item.id); as badge) {
          <p-badge class="ml-auto" [value]="badge.value" [severity]="badge.severity" />
          }
        </a>
        } @else {
        <a class="p-menu-item-link flex items-center gap-2">
          <span class="p-menu-item-icon" [class]="item.icon"></span>
          <span class="p-menu-item-label">{{ item.label }}</span>
        </a>
        }
      </ng-template>
    </p-menu>
  </div>
  }
  <div class="content">
    <router-outlet />
  </div>
</main>
