<header class="flex justify-between items-center p-4 bg-white dark:bg-slate-800 shadow">
  <div class="flex items-center">
    <p-button
      icon="pi pi-bars"
      [text]="true"
      severity="secondary"
      class="mr-2"
      (onClick)="toggleSidebar()"
    />
    <h1>Le Merlebleu</h1>
  </div>
  <div class="flex items-center">
    <p>{{ name() }}</p>
    <div class="ml-2">
      <p-button icon="pi pi-cog" severity="contrast" (onClick)="settingsMenu.toggle($event)" />
      <p-menu #settingsMenu [model]="settingsItems()" [popup]="true" />
    </div>
  </div>
</header>
<main class="main">
  @if (sidebarOpen()) {
  <div class="sidebar">
    <p-menu [model]="items" class="menu" />
  </div>
  }
  <div class="content">
    <router-outlet />
  </div>
</main>
