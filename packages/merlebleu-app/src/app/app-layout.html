<header class="flex justify-between items-center p-4 bg-white dark:bg-slate-800 shadow">
  <div class="flex items-center">
    <p-button
      icon="pi pi-bars"
      [text]="true"
      severity="secondary"
      class="mr-2"
      (onClick)="toggleSidebar()"
    />
    <h1>Le Merlebleu</h1>
  </div>
  <div class="flex items-center">
    <p>{{ name() }}</p>
    <p-overlay-badge
      [value]="notificationService.unreadCount()"
      [badgeDisabled]="notificationService.unreadCount() === 0"
      severity="danger"
      class="ml-2"
    >
      <p-button
        icon="pi pi-bell"
        [text]="true"
        severity="secondary"
        (onClick)="notifPopover.toggle($event)"
      />
    </p-overlay-badge>
    <p-popover #notifPopover>
      <app-notification-panel />
    </p-popover>
    <p-button
      [icon]="themeService.isDarkMode() ? 'pi pi-sun' : 'pi pi-moon'"
      [text]="true"
      severity="secondary"
      class="ml-2"
      (onClick)="themeService.toggleTheme()"
    />
    <p-button
      icon="pi pi-sign-out"
      [text]="true"
      severity="secondary"
      (onClick)="logout()"
    />
  </div>
</header>
<main class="main">
  @if (sidebarOpen()) {
  <div class="sidebar">
    <p-menu [model]="items" class="menu" />
  </div>
  }
  <div class="content">
    <router-outlet />
  </div>
</main>
