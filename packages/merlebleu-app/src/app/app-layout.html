<header class="flex justify-between items-center p-4 bg-white dark:bg-slate-800 shadow">
  <h1>Patisserie Le Merlebleu</h1>
  <div class="flex items-center">
    <p-avatar [label]="userInitials" class="mr-2" size="large" shape="circle" />
    <div class="mx-2">
      <p-button
        [icon]="themeService.isDarkMode() ? 'pi pi-sun' : 'pi pi-moon'"
        [severity]="themeService.isDarkMode() ? 'warn' : 'secondary'"
        (onClick)="themeService.toggleTheme()"
      />
    </div>
    <p-button severity="info" icon="pi pi-sign-out" label="Deconnexion" (onClick)="logout()" />
  </div>
</header>
<main class="main">
  <div class="sidebar">
    <p-menu [model]="items" class="menu" />
  </div>
  <div class="content">
    <router-outlet />
  </div>
</main>
